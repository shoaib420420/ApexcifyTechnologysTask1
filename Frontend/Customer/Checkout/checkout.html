<!DOCTYPE html>
<html>

<head>
    <title>Checkout</title>
    <link rel="stylesheet" href="checkout.css">
</head>

<body>
    <h2>Checkout</h2>

    <div class="checkout-container">

        <!-- LEFT: Shipping Form -->
        <div class="shipping-box">
            <!-- Navigation -->
            <div style="margin-bottom: 15px;">
                <a href="../customer.html" style="text-decoration: none; color: #64748b; font-size: 0.9rem;">&larr; Back
                    to Dashboard</a>
            </div>

            <h3>Shipping Address</h3>

            <form id="shippingForm" onsubmit="event.preventDefault(); placeOrder();">

                <label>Full Name</label>
                <input type="text" id="fullName" required>

                <label>Email</label>
                <input type="email" id="email" required>

                <label>Phone Number</label>
                <input type="text" id="phone" required>

                <label>Address</label>
                <input type="text" id="address" required>

                <div style="display: flex; gap: 10px;">
                    <div style="flex: 1;">
                        <label>City</label>
                        <input type="text" id="city" required>
                    </div>
                    <div style="flex: 1;">
                        <label>Postal Code</label>
                        <input type="text" id="postalCode" required>
                    </div>
                </div>

                <!-- Hidden submit button to allow 'Enter' key submission -->
                <button type="submit" style="display: none;"></button>
            </form>
        </div>

        <!-- RIGHT: Order Summary -->
        <div class="summary-box">
            <h3>Order Summary</h3>
            <div id="orderItems"></div>

            <hr>
            <p>Subtotal: $<span id="subtotal">0</span></p>
            <p>Shipping: $<span id="shipping">10</span></p>
            <p>Tax (5%): $<span id="tax">0</span></p>

            <h3>Total: $<span id="finalTotal">0</span></h3>

            <!-- Button triggers form submission programmatically -->
            <button id="placeOrderBtn" onclick="document.getElementById('shippingForm').requestSubmit()">Place
                Order</button>
        </div>

    </div>

    <script src="checkout.js"></script>
</body>

</html>
